<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AUXÍLIO DE MIRA - AUXÍLIO RED</title>

<style>
:root{
  --bg:#050008;
  --card:#0b0014;
  --text:#f3e9ff;
  --muted:#c9b6ff;
  --accent:#9b4dff;
  --accent-soft: rgba(155,77,255,.25);
  --accent-glow: 0 0 18px rgba(155,77,255,.9), 0 0 45px rgba(155,77,255,.45);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,Arial;
  background:var(--bg);
  color:var(--text);
}
.rain{
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(transparent, rgba(155,77,255,.45)),
    linear-gradient(transparent, rgba(155,77,255,.25));
  background-size:2px 20px, 1px 15px;
  animation: rain .35s linear infinite;
}
@keyframes rain{
  to{background-position:0 120%,50px 150%}
}
.wrap{
  min-height:100vh;
  display:grid;
  place-items:center;
}
.panel{
  width:min(680px,94vw);
  background:var(--card);
  border-radius:24px;
  padding:24px;
  border:1px solid rgba(155,77,255,.5);
  box-shadow:var(--accent-glow);
}
.title{
  text-align:center;
  padding:14px;
  margin-bottom:18px;
  background:rgba(155,77,255,.15);
  border-radius:14px;
  font-weight:900;
}
.tabs{display:flex;gap:10px;margin-bottom:16px}
.tab{
  padding:10px 16px;
  border-radius:12px;
  border:1px solid rgba(155,77,255,.5);
  background:rgba(155,77,255,.15);
  color:#fff;
  cursor:pointer;
}
.tab.active{box-shadow:var(--accent-glow)}
.tab-content{display:none}
.tab-content.active{display:block}
.btn-game{
  display:block;
  margin-top:20px;
  padding:14px;
  text-align:center;
  border-radius:14px;
  background:rgba(155,77,255,.25);
  border:1px solid rgba(155,77,255,.6);
  font-weight:800;
  color:#fff;
  text-decoration:none;
}
.footer{
  margin-top:16px;
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:var(--muted);
}
</style>
</head>

<body>
<div class="rain"></div>

<main class="wrap">
<section class="panel">

<h1 class="title">AUXÍLIO RED</h1>

<nav class="tabs">
  <button class="tab active" data-tab="headrick">Headrick</button>
  <button class="tab" data-tab="bypass">Bypass</button>
  <button class="tab" data-tab="fps">FPS</button>
  <button class="tab" data-tab="settings">Settings</button>
</nav>

<div id="headrick" class="tab-content active">
  <p>Auxílio visual ativo</p>
</div>

<div id="bypass" class="tab-content">
  <p>Proteções visuais</p>
</div>

<div id="fps" class="tab-content">
  <p>Otimização FPS</p>
</div>

<div id="settings" class="tab-content">
  <p>Versão 1.0.0</p>
  <p>Criado por MIGZADA</p>

  <!-- BOTÃO VIA SITE -->
  <a class="btn-game" href="abrir.html">
    Abrir Game
  </a>
</div>

<div class="footer">
  <span>AUXÍLIO RED</span>
  <span>MIGZADA SAF</span>
</div>

</section>
</main>

<script>
document.querySelectorAll('.tab').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.tab,.tab-content')
      .forEach(e=>e.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  }
});
</script>
</body>
</h
